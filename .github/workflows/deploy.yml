name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stage static site
        run: |
          mkdir -p _site/hsk4 _site/hsk5 _site/hsk6 _site/hsk4-textbook _site/hsk4-workbook _site/lesson
          cp index.html styles.css app.js wb4.js HSK-4A-Textbook.md HSK-4A-Workbook.md HSK-4B-Textbook.md HSK-4B-Workbook.md _site/
          node -e "const f=require('fs');eval(f.readFileSync('texts.js','utf8').replace('const TEXTS','globalThis.TEXTS'));f.writeFileSync('_site/texts.js','const TEXTS='+JSON.stringify(TEXTS)+';')"
          for f in texts.js app.js styles.css wb4.js; do
            v=$(md5sum _site/$f | cut -c1-8)
            sed -i "s|$f?v=[0-9]*|$f?v=$v|g" _site/index.html
          done
          cp _site/index.html _site/hsk4/index.html
          cp _site/index.html _site/hsk5/index.html
          cp _site/index.html _site/hsk6/index.html
          cp _site/index.html _site/hsk4-textbook/index.html
          cp _site/index.html _site/hsk4-workbook/index.html
          cp _site/index.html _site/lesson/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
