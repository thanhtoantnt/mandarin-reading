<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>读中文 · Mandarin Reading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    window.BASE = (function () {
      var p = location.pathname.replace(/\/index\.html$/, "");
      var i = p.search(/\/hsk4-textbook(?:\/|$)|\/hsk[456](?:\/|$)/);
      if (i >= 0) return p.slice(0, i);
      var j = p.search(/\/lesson(?:\/|$)/);
      if (j >= 0) return p.slice(0, j);
      return p.replace(/\/$/, "") || "";
    })();
    document.write('<link rel="stylesheet" href="' + window.BASE + '/styles.css?v=10">');
    document.write('<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">');
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    document.write('<script src="' + window.BASE + '/texts.js?v=12"><\/script>');
    document.write('<script src="' + window.BASE + '/app.js?v=14"><\/script>');
  </script>
</body>
</html>
